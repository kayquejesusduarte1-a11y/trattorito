<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trattoria D'elite</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&display=swap');
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif}
body{background:#000;color:#4a0b0b;margin:0;padding:0;min-height:100vh;overflow-x:hidden}
.home-page{width:min(820px,100%);margin:0 0 0 auto;background:#cdbb9f;box-shadow:none}
.topbar{height:26px;background:#650006;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 34px;font-family:Arial,sans-serif;font-size:11px}
.topbar nav{display:flex;gap:42px;align-items:center}
.topbar a{color:#fff;text-decoration:none;transition:.2s}
.topbar a:hover{opacity:.75}
.topbar .register{margin-left:auto}
.main-panel{display:grid;grid-template-columns:58% 42%;height:205px;min-height:205px}
.photo-panel{position:relative;min-height:360px;background:url('https://images.unsplash.com/photo-1556910103-1c02745aae4d?w=1200') center/cover no-repeat}
.photo-panel:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0003,#0000)}
.photo-title{position:absolute;left:32px;bottom:30px;color:#fff;z-index:1;text-shadow:0 2px 5px #000}
.photo-title .small{font-size:13px;letter-spacing:3px}
.photo-title h1{font-family:'Cinzel',serif;font-size:36px;line-height:1;margin:5px 0}
.photo-title p{font-size:11px;letter-spacing:2px;margin:0}
.welcome-panel{display:flex;flex-direction:column;justify-content:flex-start;padding:34px 16px 15px;background:#d7c5a9}
.welcome-panel h2{font-size:15px;line-height:1.05;font-weight:400;margin:0 0 9px;color:#650006}
.welcome-panel .line{height:1px;width:30px;background:#650006;margin-bottom:9px}
.welcome-panel p{font-size:10px;margin:0 0 12px;line-height:1.45;color:#650006}
.welcome-panel .sub{font-size:10px;border-top:1px solid #8c7160;padding-top:10px}
.cta{align-self:center;margin-top:49px;background:#650006;color:#fff;text-decoration:none;border-radius:18px;padding:4px 23px;font-size:12px;min-width:84px;text-align:center}
.cta:hover{background:#480004}
@media(max-width:700px){.home-page{width:100%}.main-panel{grid-template-columns:58% 42%;height:205px}.photo-panel{min-height:205px}.welcome-panel{min-height:205px;padding:30px 12px 10px}.topbar nav{gap:20px}}
</style>
</head>
<body>
<div class="home-page">
<header class="topbar">
<nav>
<a href="index.html">Início</a>
<a href="index.html#sobre">Sobre nós</a>
<a href="pratos.html">Cardápio</a>
</nav>
<a class="register" href="cadastro.html">| Cadastre-se</a>
</header>

<main class="main-panel">
<section class="photo-panel">
</section>

<section class="welcome-panel">
<h2>Benvenuti, dove ogni piatto<br>racconta una storia</h2>
<div class="line"></div>
<p class="sub">Sapori autentici, emozioni vere</p>
<a class="cta" href="pratos.html">Peça já</a>
</section>
</main>
</div>

<script>
const carrinho=JSON.parse(localStorage.getItem('carrinhoCantina'))||[];
</script>
</body>
</html>
