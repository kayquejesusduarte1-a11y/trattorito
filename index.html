<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trattoria D'elite</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000}
body{font-family:Arial,sans-serif;overflow-x:hidden}
.home-page{width:100%;max-width:none;margin:0}
.topbar{height:72px;background:#650006;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px}
.topbar nav{display:flex;align-items:center;gap:45px}
.topbar a{color:#fff;text-decoration:none;font-weight:400}
.register{margin-left:auto}
.main-panel{display:grid;grid-template-columns:58% 42%;height:calc(100vh - 72px);min-height:520px}
.photo-panel{height:100%;background-image:url("home.jpg?v=20261006fix");background-size:cover;background-position:center;background-repeat:no-repeat}
.welcome-panel{height:100%;background:#d8c6aa;color:#6b0909;padding:80px 8vw 50px 6vw;font-family:Georgia,'Times New Roman',serif}
.welcome-panel h2{margin:0;font-size:clamp(28px,3.2vw,52px);line-height:1.08;font-weight:400}
.line{width:72px;height:2px;background:#6b0909;margin:24px 0 18px}
.sub{margin:0;font-family:Arial,sans-serif;font-size:clamp(13px,1.3vw,18px);line-height:1.4;color:#8b1616}
.cta{display:block;width:130px;margin:70px auto 0;background:#650006;color:#fff;text-align:center;text-decoration:none;border-radius:18px;padding:10px 0;font-family:Georgia,'Times New Roman',serif;font-size:15px;line-height:18px}
@media(max-width:760px){
  .topbar{height:62px;padding:0 15px;font-size:12px}
  .topbar nav{gap:18px}
  .main-panel{grid-template-columns:1fr;height:auto;min-height:0}
  .photo-panel{height:55vw;min-height:280px}
  .welcome-panel{height:auto;min-height:330px;padding:42px 25px}
  .welcome-panel h2{font-size:30px}
  .cta{margin-top:45px}
}
</style>
</head>
<body>
<div class="home-page">
  <header class="topbar">
    <nav>
      <a href="index.html">Início</a>
      <a href="index.html#sobre">Sobre nós</a>
      <a href="pratos.html">Cardápio</a>
    </nav>
    <a class="register" href="cadastro.html">| Cadastre-se</a>
  </header>
  <main class="main-panel">
    <section class="photo-panel" aria-label="Trattoria D'elite"></section>
    <section class="welcome-panel">
      <h2>Benvenuti, dove ogni piatto<br>racconta una storia</h2>
      <div class="line"></div>
      <p class="sub">Sapori autentici, emozioni vere</p>
      <a class="cta" href="pratos.html">Peça já</a>
    </section>
  </main>
</div>
<!-- imagem-home-arquivo-2026-10-06 -->
</body>
</html>
