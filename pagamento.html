<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finalizar pedido | Trattorito D’elite</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><a class="site-back" href="carrinho.html">‹ Carrinho</a><a class="site-logo" href="index.html">Finalizar pedido</a><a class="site-cart" href="carrinho.html">🛒</a></header><main class="checkout-wrap"><div class="checkout-card"><div class="checkout-steps"><span class="step active">1. Pagamento</span><span class="step">2. Endereço</span><span class="step">3. Revisão</span></div><section id="s1" class="checkout-section active-section"><h1>Pagamento</h1><p>Checkout demonstrativo do projeto escolar.</p><label class="choice-card"><input type="radio" name="p" value="Pix"><div class="choice-info"><strong>Pix</strong><span>Pagamento demonstrativo.</span></div></label><label class="choice-card"><input type="radio" name="p" value="Cartão"><div class="choice-info"><strong>Cartão</strong><span>Pagamento demonstrativo.</span></div></label><button class="checkout-button" onclick="go2()">Continuar →</button></section><section id="s2" class="checkout-section"><h1>Endereço</h1><div class="field"><label>Endereço</label><input id="end" required></div><div class="field"><label>Número</label><input id="num" required></div><div class="field"><label>Cidade</label><input id="city" required></div><button class="checkout-button" onclick="go3()">Continuar →</button><button class="back-button" onclick="show(1)">Voltar</button></section><section id="s3" class="checkout-section"><h1>Revisão</h1><div class="review-box"><h3>Resumo</h3><p id="summary"></p><div id="items"></div></div><button class="checkout-button" onclick="finish()">Finalizar pedido</button><button class="back-button" onclick="show(2)">Voltar</button></section><section id="done" class="finished-section"><h1>Pedido Finalizado!</h1><p>Checkout demonstrativo concluído.</p><a class="btn btn-buy" href="index.html">Voltar ao início</a></section></div></main><footer class="site-footer"><div class="footer-title">Trattorito D’elite</div><div class="footer-bottom">Projeto escolar demonstrativo.</div></footer><script>const cart=JSON.parse(localStorage.getItem('carrinhoCantina'))||[];function show(n){document.querySelectorAll('.checkout-section').forEach(x=>x.classList.remove('active-section'));document.getElementById('s'+n).classList.add('active-section')}function go2(){if(!document.querySelector('input[name=p]:checked')){alert('Escolha uma forma de pagamento.');return}show(2)}function go3(){if(!end.value.trim()||!num.value.trim()||!city.value.trim()){alert('Preencha os dados do endereço.');return}summary.textContent='Entrega: '+end.value+', '+num.value+' - '+city.value;items.innerHTML=cart.map(x=>'<div class="review-item">'+x.quantidade+'x '+x.nome+'</div>').join('');show(3)}function finish(){localStorage.removeItem('carrinhoCantina');document.getElementById('s3').style.display='none';document.getElementById('done').classList.add('show')}</script></body></html>
