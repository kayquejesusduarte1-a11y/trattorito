<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Trattorito D’elite</title><link rel="stylesheet" href="style.css?v=20261006final"><link rel="stylesheet" href="melhorias-1a8.css?v=1">
</head><body><header class="site-header"><a class="site-back" href="index.html">‹ Início</a><a class="site-logo" href="index.html">Entrar</a><a class="site-cart" href="carrinho.html">🛒</a></header><main class="auth-wrap"><div class="auth-card"><div class="auth-info"><h2>Bem-vindo</h2><p>Entre para continuar sua experiência no Trattorito D’elite.</p><a class="link-btn" href="cadastro.html">Ainda não tenho cadastro →</a></div><div class="auth-form"><h1>Entrar</h1><form onsubmit="login(event)"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="senha" type="password" required></div><button class="form-submit">ENTRAR</button></form></div></div></main><footer class="site-footer"><div class="footer-title">Trattorito D’elite</div><div class="footer-bottom">Projeto escolar demonstrativo.</div></footer><script>function login(e){e.preventDefault();const u=JSON.parse(localStorage.getItem('usuarioTrattorito'));if(!u){alert('Faça seu cadastro primeiro.');location.href='cadastro.html';return}if(document.getElementById('email').value.trim().toLowerCase()!==u.email||document.getElementById('senha').value!==u.senha){alert('E-mail ou senha incorretos.');return}localStorage.setItem('usuarioLogado','true');alert('Login realizado!');location.href='index.html'}</script><script defer src="melhorias-1a8.js?v=1"></script>
</body></html>
