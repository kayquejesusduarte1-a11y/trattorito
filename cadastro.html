<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Trattorito Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo font-cinzel">
                <a href="index.html" style="color: var(--cream); text-decoration: none; font-weight: bold; font-size: 1.2rem;">TRATTORITO ELITE</a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="pratos.html">Cardápio</a></li>
            </ul>
            <div class="user-actions">
                <a href="carrinho.html" class="cart-icon" style="text-decoration: none;">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cart-count">0</span>
                </a>
            </div>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-card-side">
            <div class="auth-info-card">
                <h2 class="font-cinzel" style="margin-bottom: 15px;">Já possui conta?</h2>
                <p>Faça login para acessar seus dados e histórico de pedidos no Trattorito Elite.</p>
                <a href="login.html" class="btn-toggle-auth" style="text-decoration: none; display: block; line-height: 2.2;">Entrar</a>
                <a href="index.html" class="btn-toggle-auth secondary" style="text-decoration: none; display: block; line-height: 2.2;">Cancelar</a>
            </div>
        </div>
        <div class="auth-form-side">
            <h2 class="font-cinzel" style="color: var(--cream); margin-bottom: 30px;">Criar Conta</h2>
            <form onsubmit="realizarCadastro(event)">
                <div class="form-input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Nome Completo" required>
                </div>
                <div class="form-input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" placeholder="E-mail" required>
                </div>
                <div class="form-input-group">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" placeholder="Telefone" required>
                </div>
                <div class="form-input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Senha" required>
                </div>
                <button type="submit" class="btn-order" style="width: 100%; margin-top: 10px;">CADASTRAR</button>
            </form>
            <div class="social-login-box">
                <button class="social-icon-btn"><i class="fa-brands fa-facebook"></i></button>
                <button class="google-text-btn"><i class="fa-brands fa-google"></i></button>
            </div>
        </div>
    </div>

    <script>
        function atualizarBadgeCarrinho() {
            const carrinho = JSON.parse(localStorage.getItem('carrinhoCantina')) || [];
            const totalItens = carrinho.reduce((sum, item) => sum + item.quantidade, 0);
            document.getElementById('cart-count').innerText = totalItens;
        }

        function realizarCadastro(event) {
            event.preventDefault();

            const form = event.target;
            const nome = form.querySelector('input[type="text"]').value.trim();
            const email = form.querySelector('input[type="email"]').value.trim().toLowerCase();
            const telefone = form.querySelector('input[type="tel"]').value.trim();
            const senha = form.querySelector('input[type="password"]').value;

            const usuario = { nome, email, telefone, senha };
            localStorage.setItem('usuarioTrattorito', JSON.stringify(usuario));

            alert('Cadastro realizado com sucesso! Faça login para continuar.');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', atualizarBadgeCarrinho);
    </script>
</body>
</html>
