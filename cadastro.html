<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | Trattorito D’elite</title><link rel="stylesheet" href="style.css?v=20261006"></head><body><header class="site-header"><a class="site-back" href="index.html">‹ Início</a><a class="site-logo" href="index.html">Cadastro</a><a class="site-cart" href="carrinho.html">🛒</a></header><main class="auth-wrap"><div class="auth-card"><div class="auth-info"><h2>Crie sua conta</h2><p>Cadastre seus dados para usar o projeto demonstrativo.</p><a class="link-btn" href="login.html">Já tenho cadastro →</a></div><div class="auth-form"><h1>Cadastrar</h1><form onsubmit="cad(event)"><div class="field"><label>Nome completo</label><input id="nome" required></div><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Telefone</label><input id="telefone" required></div><div class="field"><label>Senha</label><input id="senha" type="password" required></div><button class="form-submit">CADASTRAR</button></form></div></div></main><footer class="site-footer"><div class="footer-title">Trattorito D’elite</div><div class="footer-bottom">Projeto escolar demonstrativo.</div></footer><script>function cad(e){e.preventDefault();localStorage.setItem('usuarioTrattorito',JSON.stringify({nome:nome.value.trim(),email:email.value.trim().toLowerCase(),telefone:telefone.value.trim(),senha:senha.value}));alert('Cadastro realizado com sucesso!');location.href='login.html'}</script></body></html>
